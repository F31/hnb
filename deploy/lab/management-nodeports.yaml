apiVersion: v1
kind: Service
metadata:
  name: lab-agent-exchange
  namespace: hnb-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: lab-observer-ingest
  namespace: hnb-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: lab-agent-tunnel
  namespace: hnb-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tunnel-server
  ports:
    - name: tunnel
      port: 9443
      targetPort: 9443
      nodePort: 30083
