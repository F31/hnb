# Direct infrastructure routing probe, not an HNB-managed application action.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: probe
  namespace: hnb-lab-probes
spec:
  parentRefs:
    - name: hnb-lab
      namespace: hnb-gateway
  hostnames: [app.hnb.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: probe-server
          port: 8080
