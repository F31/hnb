# Minimal lab permission for the gateway route binding action.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hnb-provider-routes, namespace: hnb-lab-probes}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hnb-provider-routes, namespace: hnb-lab-probes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hnb-provider-routes}
subjects:
  - {kind: ServiceAccount, name: hnb-provider, namespace: hnb-app}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hnb-provider-gateways, namespace: hnb-gateway}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: hnb-provider-gateways, namespace: hnb-gateway}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: hnb-provider-gateways}
subjects:
  - {kind: ServiceAccount, name: hnb-provider, namespace: hnb-app}
