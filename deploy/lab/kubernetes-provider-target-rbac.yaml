# Lab baseline for a provider-scoped target identity. Do not bind cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hnb-provider
  namespace: hnb-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hnb-provider-workloads
  namespace: hnb-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hnb-provider-workloads
  namespace: hnb-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hnb-provider-workloads
subjects:
  - kind: ServiceAccount
    name: hnb-provider
    namespace: hnb-app
