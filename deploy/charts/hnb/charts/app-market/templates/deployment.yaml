apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default $.Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy }}
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | default $.Values.global.nats.url }}
            - name: NATS_TLS_CERT_FILE
              value: /var/run/hnb-nats/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /var/run/hnb-nats/tls.key
            - name: NATS_TLS_CA_FILE
              value: /var/run/hnb-nats/ca.crt
            - name: DB_DSN
              value: {{ required "app-market.db.dsn must reference the independent App Market database" .Values.db.dsn | quote }}
            - name: API_TOKEN_ISSUER
              value: {{ required "app-market.identity.issuer is required" .Values.identity.issuer | quote }}
            - name: API_TOKEN_AUDIENCE
              value: "hnb-app-market"
            - name: API_TOKEN_KEY_MANIFEST_FILE
              value: /var/run/hnb-identity/{{ .Values.identity.manifestKey }}
            - name: API_TOKEN_KEY_RELOAD_INTERVAL
              value: {{ .Values.identity.reloadInterval | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: identity-public-key
              mountPath: /var/run/hnb-identity
              readOnly: true
            - name: nats-client-tls
              mountPath: /var/run/hnb-nats
              readOnly: true
      volumes:
        - name: identity-public-key
          secret:
            secretName: {{ required "app-market.identity.existingManifestSecret is required" .Values.identity.existingManifestSecret }}
            defaultMode: 0400
        - name: nats-client-tls
          secret:
            secretName: {{ required "app-market.nats.existingClientTLSSecret is required" .Values.nats.existingClientTLSSecret }}
            defaultMode: 0400
