replicaCount: 1
probes:
  enabled: true
# The scratch image runs as this non-root UID.
runAsUser: 65532
sandbox:
  # Init-container image. It must be digest-pinned like every other image and
  # must already exist in the node image set.
  repository: rancher/mirrored-library-busybox
  digest: ""
  pullPolicy: ""
image:
  repository: hnb/{{ .Chart.Name }}
  digest: ""
  pullPolicy: ""
nats:
  url: ""
  # Plane account Secret providing user/password for NATS authentication.
  existingAccountSecret: ""
  existingClientTLSSecret: ""
db:
  existingSecret: ""
  secretKey: dsn
  # Legacy inline DSN; existingSecret takes precedence.
  dsn: ""
platformAPIURL: http://platform-api:8080
appMarketURL: http://app-market:8080
clusterReadProjection:
  mode: shadow
  alerts:
    enabled: false
bootstrapAdmin:
  # Initial instance credential, supplied as an existing Secret, never values.
  existingSecret: ""
  passwordKey: password
identity:
  # Copied from the Secret to a private, owner-only file by the init container.
  stagedKeyName: active-private.pem
  issuer: ""
  audiences: "hnb-apiserver,hnb-platform-api,hnb-app-market"
  reloadInterval: 5s
  existingManifestSecret: ""
  manifestKey: manifest.json
  existingPrivateKeySecret: ""
  privateKeyKey: "tls.key"
agentOnboarding:
  # apiserver 对外可达地址（渲染 cluster-agent 隧道回连地址 TUNNEL_URL 用）；
  # 留空则按请求协议/Host 推导（适合单域名反代部署）。
  publicBaseURL: ""
  # 接入清单中引用的 cluster-agent 镜像
  image: hnb/cluster-agent:latest
resources:
  requests:
    cpu: 125m
    memory: 256Mi
  limits:
    cpu: 400m
    memory: 512Mi
