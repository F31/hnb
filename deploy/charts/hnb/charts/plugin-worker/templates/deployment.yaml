apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hnb.image" . }}
          imagePullPolicy: {{ include "hnb.imagePullPolicy" . }}
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "plugin-worker.db.existingSecret is required" .Values.db.existingSecret }}
                  key: {{ .Values.db.secretKey | quote }}
            - name: NATS_URL
              value: {{ .Values.nats.url | default $.Values.global.nats.url | quote }}
            - name: NATS_TLS_CERT_FILE
              value: /var/run/hnb-nats/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /var/run/hnb-nats/tls.key
            - name: NATS_TLS_CA_FILE
              value: /var/run/hnb-nats/ca.crt
            {{- include "plugin-worker.natsAccountEnv" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: HNB_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "plugin-worker.masterKeySecret is required" .Values.masterKeySecret }}
                  key: key
            - name: LISTEN_ADDR
              value: {{ required "plugin-worker.listenAddress is required" .Values.listenAddress | quote }}
            - name: HELM_PATH
              value: /usr/local/bin/helm
            - name: KUBECONFIG_DIR
              value: {{ required "plugin-worker.kubeconfigDir is required" .Values.kubeconfigDir | quote }}
            - name: PLUGIN_WORKER_DRY_RUN
              value: {{ required "plugin-worker.dryRun is required" .Values.dryRun | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
{{- include "plugin-worker.natsAccountMounts" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: nats-client-tls
              mountPath: /var/run/hnb-nats
              readOnly: true
      volumes:
{{- include "plugin-worker.natsAccountVolumes" (dict "root" $ "component" .Values.nats) | nindent 8 }}
        - name: nats-client-tls
          secret:
            secretName: {{ required "plugin-worker.nats.existingClientTLSSecret is required" .Values.nats.existingClientTLSSecret }}
            defaultMode: 0440
