apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hnb.image" . }}
          imagePullPolicy: {{ include "hnb.imagePullPolicy" . }}
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | default $.Values.global.nats.url }}
            {{- include "tunnel-server.natsAccountEnv" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: DB_DSN
              {{- if .Values.db.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret | quote }}
                  key: {{ .Values.db.secretKey | default "dsn" | quote }}
              {{- else }}
              value: {{ .Values.db.dsn | default $.Values.global.postgresql.dsn | quote }}
              {{- end }}
            - name: API_TOKEN_ISSUER
              value: {{ required "tunnel-server.identity.issuer is required" .Values.identity.issuer | quote }}
            - name: API_TOKEN_AUDIENCE
              value: hnb-apiserver-tunnel
            - name: API_TOKEN_KEY_MANIFEST_FILE
              value: /var/run/hnb-identity/{{ .Values.identity.manifestKey }}
            - name: API_TOKEN_KEY_RELOAD_INTERVAL
              value: {{ .Values.identity.reloadInterval | quote }}
          ports:
            - containerPort: 9443
              name: tunnel
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
{{- include "tunnel-server.natsAccountMounts" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: identity-public-keys
              mountPath: /var/run/hnb-identity
              readOnly: true
      volumes:
{{- include "tunnel-server.natsAccountVolumes" (dict "root" $ "component" .Values.nats) | nindent 8 }}
        - name: identity-public-keys
          secret:
            secretName: {{ required "tunnel-server.identity.existingManifestSecret is required" .Values.identity.existingManifestSecret }}
            defaultMode: 0440
