replicaCount: 1
image:
  repository: hnb/{{ .Chart.Name }}
  digest: ""
  pullPolicy: ""
nats:
  url: ""
  # Plane account Secret providing user/password for NATS authentication.
  existingAccountSecret: ""
  existingClientTLSSecret: ""
db:
  existingSecret: ""
  secretKey: dsn
  dsn: ""
masterKey:
  # Secret holding the platform master key (HNB_MASTER_KEY) used to decrypt
  # stored target kubeconfigs; without it credential resolution fails closed.
  existingSecret: ""
  key: "master-key"
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
