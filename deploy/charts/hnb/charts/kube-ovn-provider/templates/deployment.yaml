apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default $.Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy }}
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | default $.Values.global.nats.url }}
            - name: NATS_TLS_CERT_FILE
              value: /var/run/hnb-nats/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /var/run/hnb-nats/tls.key
            - name: NATS_TLS_CA_FILE
              value: /var/run/hnb-nats/ca.crt
            - name: DB_DSN
              value: {{ .Values.db.dsn | default $.Values.global.postgresql.dsn }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nats-client-tls
              mountPath: /var/run/hnb-nats
              readOnly: true
      volumes:
        - name: nats-client-tls
          secret:
            secretName: {{ required "kube-ovn-provider.nats.existingClientTLSSecret is required" .Values.nats.existingClientTLSSecret }}
            defaultMode: 0400
