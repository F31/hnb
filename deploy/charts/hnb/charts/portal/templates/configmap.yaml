{{- $upstream := required "portal.apiBaseURL is required" .Values.apiBaseURL -}}
{{- if not (regexMatch "^https?://[a-zA-Z0-9.-]+(:[0-9]+)?$" $upstream) -}}
{{- fail "portal.apiBaseURL must be an internal HTTP(S) origin without a path" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      include /etc/nginx/conf.d/default.conf;
    }
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html/shell;
      location / { try_files $uri $uri/ /index.html; }
      location /config/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
      }
      location /modules/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
      }
      location /api/ {
        proxy_pass {{ $upstream }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /tunnel {
        proxy_pass {{ $upstream }};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }
