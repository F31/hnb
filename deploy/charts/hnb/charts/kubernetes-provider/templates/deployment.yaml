apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default $.Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default $.Values.global.imagePullPolicy }}
          env:
            - name: API_TOKEN_ISSUER
              value: {{ required "kubernetes-provider.identity.issuer is required" .Values.identity.issuer | quote }}
            - name: API_TOKEN_AUDIENCE
              value: hnb-kubernetes-provider
            - name: API_TOKEN_KEY_MANIFEST_FILE
              value: /var/run/hnb-identity/{{ .Values.identity.manifestKey }}
            - name: API_TOKEN_KEY_RELOAD_INTERVAL
              value: {{ .Values.identity.reloadInterval | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: identity-public-key
              mountPath: /var/run/hnb-identity
              readOnly: true
      volumes:
        - name: identity-public-key
          secret:
            secretName: {{ required "kubernetes-provider.identity.existingManifestSecret is required" .Values.identity.existingManifestSecret }}
            defaultMode: 0400
