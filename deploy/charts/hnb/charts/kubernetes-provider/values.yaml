replicaCount: 1
listenAddress: ":8080"
# Explicit execution scope; no implicit access to every namespace.
allowedNamespaces: []
maxReplicas: 10
image:
  repository: hnb/{{ .Chart.Name }}
  digest: ""
  pullPolicy: ""
nats:
  url: ""
  # Plane account Secret providing user/password for NATS authentication.
  existingAccountSecret: ""
db:
  dsn: ""
identity:
  issuer: ""
  reloadInterval: 5s
  existingManifestSecret: ""
  manifestKey: manifest.json
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
