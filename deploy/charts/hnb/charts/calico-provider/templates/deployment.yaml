apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroup: {{ .Values.runAsUser | default 65532 }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hnb.image" . }}
          imagePullPolicy: {{ include "hnb.imagePullPolicy" . }}
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | default $.Values.global.nats.url }}
            - name: NATS_TLS_CERT_FILE
              value: /var/run/hnb-nats/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /var/run/hnb-nats/tls.key
            - name: NATS_TLS_CA_FILE
              value: /var/run/hnb-nats/ca.crt
            {{- include "calico-provider.natsAccountEnv" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: DB_DSN
              {{- if .Values.db.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret | quote }}
                  key: {{ .Values.db.secretKey | default "dsn" | quote }}
              {{- else }}
              value: {{ .Values.db.dsn | default $.Values.global.postgresql.dsn | quote }}
              {{- end }}
            {{- if .Values.masterKey.existingSecret }}
            - name: HNB_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKey.existingSecret }}
                  key: {{ .Values.masterKey.key | default "master-key" }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
{{- include "calico-provider.natsAccountMounts" (dict "root" $ "component" .Values.nats) | nindent 12 }}
            - name: nats-client-tls
              mountPath: /var/run/hnb-nats
              readOnly: true
      volumes:
{{- include "calico-provider.natsAccountVolumes" (dict "root" $ "component" .Values.nats) | nindent 8 }}
        - name: nats-client-tls
          secret:
            secretName: {{ required "calico-provider.nats.existingClientTLSSecret is required" .Values.nats.existingClientTLSSecret }}
            defaultMode: 0440
