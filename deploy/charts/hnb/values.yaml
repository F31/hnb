global:
  imageRegistry: ""
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  nats:
    url: tls://nats:4222
  postgresql:
    dsn: postgres://postgres:postgres@postgres:5432/hnb?sslmode=disable

apiserver:
  enabled: true
  replicaCount: 2
  image:
    repository: hnb/apiserver
  nats:
    existingClientTLSSecret: nats-apiserver-client-tls
  service:
    port: 8080
  identity:
    issuer: ""
    audiences: "hnb-apiserver,hnb-platform-api,hnb-app-market"
    reloadInterval: 5s
    existingManifestSecret: ""
    manifestKey: manifest.json
    existingPrivateKeySecret: ""
    privateKeyKey: "tls.key"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

operation-worker:
  enabled: true
  replicaCount: 2
  image:
    repository: hnb/operation-worker
  nats:
    existingClientTLSSecret: nats-operation-worker-client-tls
  runtimeProviders: ""
  serviceTokenSecret: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

extension-controller:
