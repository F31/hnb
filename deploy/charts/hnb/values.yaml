global:
  # startup is an opt-in initial composition, not complete Minimal acceptance.
  deploymentStage: full
  # imageRegistry retargets every component at once (for example at Harbor).
  # There is deliberately no imageTag: every image must be pinned by digest, and
  # a mutable tag is not an artifact identity a release lock can verify.
  imageRegistry: ""
  # Name of an existing Secret holding platform credentials (tunnel/API tokens).
  # The chart never creates or defaults it: a shipped default would be a shared
  # secret in every installation, and would end up in release values metadata.
  existingSecretName: ""
  imagePullPolicy: IfNotPresent
  # backings selects the data-plane backing: bundled (single-instance PostgreSQL
  # and file JetStream, the Minimal default), in-cluster-ha (control-node
  # replicated PostgreSQL via CloudNativePG plus a 3-node JetStream cluster) or
  # external (managed outside the cluster). This is a render-time choice only:
  # install still passes the capability evidence gate, so an HA profile stays
  # uncertified until it has its own failure, failover and recovery drills.
  backings: bundled
  # controlPlaneDomains is the operator-declared number of independent schedulable
  # control-plane domains. in-cluster-ha requires at least 3.
  controlPlaneDomains: 1
  nats:
    url: tls://nats:4222
    # Plane whose NATS account each component authenticates as. The bundled
    # server declares one username/password user per plane, so a client
    # certificate alone cannot authenticate. Set per component with
    # <component>.nats.existingAccountSecret.
    plane: ""
    # Secret name prefix; the plane Secret is <prefix>-<plane>.
    accountSecretPrefix: hnb
  postgresql:
    dsn: postgres://postgres:postgres@postgres:5432/hnb?sslmode=disable

# Bundled infrastructure for the Minimal profile. Each owned plane gets its own
# database/role and Secret; credentials are generated at install time and are
# never values. With global.backings=in-cluster-ha the same subcharts render the
# control-node HA topology (CloudNativePG Cluster, 3-node JetStream); with
# external, disable both and bind externally managed backings instead.
postgresql:
  enabled: true
  adminSecret: ""
nats:
  enabled: true

# Candidate components: opt in with verified images and required Secret refs.
plugin-worker:
  enabled: false
runtime-target-lifecycle-provider:
  enabled: false
portal:
  enabled: false

apiserver:
  enabled: true
  replicaCount: 2
  image:
    repository: hnb/apiserver
  nats:
    existingClientTLSSecret: nats-apiserver-client-tls
  service:
    port: 8080
  identity:
    issuer: ""
    audiences: "hnb-apiserver,hnb-platform-api,hnb-app-market"
    reloadInterval: 5s
    existingManifestSecret: ""
    manifestKey: manifest.json
    existingPrivateKeySecret: ""
    privateKeyKey: "tls.key"
  resources:
    requests:
      cpu: 125m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

