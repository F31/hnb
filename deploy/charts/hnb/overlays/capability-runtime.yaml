# Independent runtime implementations; writes still pass through Operation.
runtime-target-lifecycle-provider: {enabled: true, replicaCount: 1}
kubernetes-provider: {enabled: true, replicaCount: 1}

# Each NATS client authenticates as the platform plane account; the Secret must
# carry user/password keys and never appears in values.
nats:
  existingAccountSecret: hnb-platform-nats
