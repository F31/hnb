apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hnb:publisher
  labels:
    app.kubernetes.io/name: hnb-cloud
    app.kubernetes.io/component: rbac
    hnb.cloud/role: publisher
  annotations:
    hnb.cloud/role-description: "Platform role mapping for publisher. Deploy workload + read monitoring resources."
    hnb.cloud/inherits-from: "readonly"
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
