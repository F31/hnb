apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hnb:tenant-admin
  labels:
    app.kubernetes.io/name: hnb-cloud
    app.kubernetes.io/component: rbac
    hnb.cloud/role: tenant-admin
  annotations:
    hnb.cloud/role-description: "Platform role mapping for tenant_admin. Full resource access within tenant namespaces, excluding namespace deletion."
    hnb.cloud/inherits-from: "project_admin"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
