apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rbac-syncer.fullname" . }}
  labels: {{ include "rbac-syncer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rbac-syncer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "rbac-syncer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rbac-syncer
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: syncer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SHADOW_MODE
              value: "{{ .Values.config.shadowMode }}"
            - name: POLL_INTERVAL
              value: "{{ .Values.config.pollInterval }}"
            - name: SYNC_TIMEOUT
              value: "{{ .Values.config.syncTimeout }}"
            - name: MAX_RETRIES
              value: "{{ .Values.config.maxRetries }}"
            - name: METRICS_ADDR
              value: "{{ .Values.config.metricsAddr }}"
            - name: HEALTH_ADDR
              value: "{{ .Values.config.healthAddr }}"
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.database.port }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.user }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hnb-database
                  key: password
                  optional: true
            - name: KUBE_QPS
              value: "{{ .Values.k8s.qps }}"
            - name: KUBE_BURST
              value: "{{ .Values.k8s.burst }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
