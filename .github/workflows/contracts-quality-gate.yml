name: Contracts Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/*contract*.mjs"
      - "package.json"
      - "package-lock.json"
      - "redocly.yaml"
      - ".github/workflows/contracts-quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/*contract*.mjs"
      - "package.json"
      - "package-lock.json"
      - "redocly.yaml"
      - ".github/workflows/contracts-quality-gate.yml"

permissions:
  contents: read

jobs:
  validate-contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Validate Contracts
    runs-on: [self-hosted, linux, x64, hnb-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-contracts.mjs
