name: OpenSpec Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openspec/**"
      - "scripts/validate-openspec.mjs"
      - ".github/workflows/openspec-quality-gate.yml"
  push:
    branches:
      - main
    paths:
      - "openspec/**"
      - "scripts/validate-openspec.mjs"
      - ".github/workflows/openspec-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openspec:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Validate OpenSpec
    runs-on: [self-hosted, linux, x64, hnb-test]
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2

      - name: Install approved OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.3.1

      - name: Run repository quality gate
        run: node scripts/validate-openspec.mjs
