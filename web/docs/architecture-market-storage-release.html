  <h2>HNB App Market 与 Harbor/ReleasePackage/Blueprint 架构关系</h2>
  <div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph='{&quot;highlight&quot;: &quot;#0000ff&quot;, &quot;nav&quot;: true, &quot;resize&quot;: true, &quot;toolbar&quot;: &quot;zoom&quot;, &quot;xml&quot;: &quot;&lt;mxGraphModel dx=\&quot;1200\&quot; dy=\&quot;1200\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;1200\&quot; pageHeight=\&quot;1100\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot;&gt;\n  &lt;root&gt;\n    &lt;mxCell id=\&quot;0\&quot;/&gt;\n    &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot;/&gt;\n\n    &lt;!-- LAYER 1: Service Blueprint --&gt;\n    &lt;mxCell id=\&quot;blueprint\&quot; value=\&quot;&amp;lt;b&amp;gt;Service Blueprint&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;用户抽象层 · 首位消费入口 (BLUE-001~005)&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• 面向用户选择应用/数据库/中间件服务&amp;lt;br&amp;gt;• 生命周期能力协商 (required/optional 求交集)&amp;lt;br&amp;gt;• 标准 Binding 输出 (Endpoint, Port, TLS, SecretRef)&amp;lt;br&amp;gt;• 首批: PostgreSQL, Valkey/RabbitMQ Service Provider&amp;lt;br&amp;gt;• 隐藏底层 CRD / Chart / Provider / Harbor 细节&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;60\&quot; width=\&quot;320\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- LAYER 2: App Market --&gt;\n    &lt;mxCell id=\&quot;market\&quot; value=\&quot;&amp;lt;b&amp;gt;App Market&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;独立部署 · 独立数据库 · 不直接访问业务集群 (MKT-001~005)&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• 产品模型: Publisher → Product → Package → Artifact → Release → Channel&amp;lt;br&amp;gt;• 组合发布: CompositionRelease (跨产品编排)&amp;lt;br&amp;gt;• 授权: Entitlement / Subscription&amp;lt;br&amp;gt;• 发布门禁: Schema验证, 兼容性, 签名, SBOM, 漏洞, 许可证&amp;lt;br&amp;gt;• ❌ 不保存 kubeconfig / 运行凭据 / Secret&amp;lt;br&amp;gt;• ❌ 不直接调用 Kubernetes API&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;230\&quot; width=\&quot;320\&quot; height=\&quot;140\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edge: Blueprint → Market --&gt;\n    &lt;mxCell id=\&quot;e-bp-mkt\&quot; value=\&quot;选择 Release 产品\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;blueprint\&quot; target=\&quot;market\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- LAYER 3: Harbor + Release Package --&gt;\n    &lt;mxCell id=\&quot;harbor\&quot; value=\&quot;&amp;lt;b&amp;gt;Harbor (OCI Registry)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;实际制品存储基础设施&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• OCI Distribution Spec 兼容 API&amp;lt;br&amp;gt;• SHA-256 内容寻址 + digest 锁定&amp;lt;br&amp;gt;• 镜像/Chart/JAR/WAR/SBOM 统一管理&amp;lt;br&amp;gt;• RBAC + 机器人账户 + 短期凭据&amp;lt;br&amp;gt;• 支持 Proxy Cache 三级分发&amp;lt;br&amp;gt;• 内置 GC (需平台侧引用保护)&amp;lt;br&amp;gt;• 提供直传 API (当前被 app-market 代理绕过)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffe6cc;strokeColor=#d79b00;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;50\&quot; y=\&quot;420\&quot; width=\&quot;290\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Storage abstraction layer --&gt;\n    &lt;mxCell id=\&quot;storage-abs\&quot; value=\&quot;&amp;lt;b&amp;gt;pkg/appstore/storage/&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• oci.go: Harbor OCI 客户端 (363行)&amp;lt;br&amp;gt;  - Upload/Download/Delete/ListTags&amp;lt;br&amp;gt;  - HNB 注解 + 文件类型映射&amp;lt;br&amp;gt;• types.go: StorageBackend 枚举&amp;lt;br&amp;gt;  - oci ✓ (已实现, Harbor)&amp;lt;br&amp;gt;  - s3 ✗ / local ✗ (待实现)&amp;lt;br&amp;gt;• StorageConfig: 后端配置模型&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;50\&quot; y=\&quot;590\&quot; width=\&quot;290\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;mxCell id=\&quot;release-pkg\&quot; value=\&quot;&amp;lt;b&amp;gt;Release Package&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;ReleaseManifest 完整性 &amp;amp; 运行约束 (REL-001~004)&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• Package digest + 参数 Schema + 依赖声明&amp;lt;br&amp;gt;• targetTypes / 多架构 (amd64, arm64, GPU/NPU) 兼容预检&amp;lt;br&amp;gt;• JAR/WAR → OCI Artifact 入库 + 容器化运行约束&amp;lt;br&amp;gt;• 撤销与影响分析: 签名撤销 Artifact, 识别受影响实例&amp;lt;br&amp;gt;• 引用: MKT-04, CMPOS-02, EDGE-06, ART-04, CTN-03&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;480\&quot; y=\&quot;420\&quot; width=\&quot;290\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edges: Market → Harbor + Release Package --&gt;\n    &lt;mxCell id=\&quot;e-mkt-harbor\&quot; value=\&quot;i) 引用 Artifact (by digest)&amp;lt;br&amp;gt;OCI URL: harbor:443/v2/...\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;market\&quot; target=\&quot;harbor\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;mxCell id=\&quot;e-mkt-rel\&quot; value=\&quot;ii) 引用 ReleaseManifest\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;market\&quot; target=\&quot;release-pkg\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edge: Harbor → storage-abs --&gt;\n    &lt;mxCell id=\&quot;e-harbor-storage\&quot; value=\&quot;封装 Harbor API\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;harbor\&quot; target=\&quot;storage-abs\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Cross edge: Harbor ↔ Release Package --&gt;\n    &lt;mxCell id=\&quot;e-art-rel\&quot; value=\&quot;iii) Package 声明 digest, Harbor 按 REL 规范存储\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;dashed=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;harbor\&quot; target=\&quot;release-pkg\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- LAYER 4: CompositionOperation / ExecutionPlan --&gt;\n    &lt;mxCell id=\&quot;comp-op\&quot; value=\&quot;&amp;lt;b&amp;gt;CompositionOperation&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;组合编排层 — 唯一写入入口&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• 接收 Release/CompositionRelease + 授权上下文&amp;lt;br&amp;gt;• 目标选择 + Secret 解析 + 资源预检&amp;lt;br&amp;gt;• 生成 ExecutionPlan (固定 digest, 不可变)&amp;lt;br&amp;gt;• 不可绕过: 所有写操作必须经过此层&amp;lt;br&amp;gt;• Agent 直接从 Harbor 拉取制品 (不经过 Market API)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;760\&quot; width=\&quot;320\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;mxCell id=\&quot;exec-plan\&quot; value=\&quot;&amp;lt;b&amp;gt;ExecutionPlan → Operation&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;执行计划 &amp;amp; 状态机 — 最终一致&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• 分步执行, 可回滚, 幂等性保证&amp;lt;br&amp;gt;• PostgreSQL Operation Store + NATS JetStream 异步驱动&amp;lt;br&amp;gt;• 审计日志全覆盖&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;910\&quot; width=\&quot;320\&quot; height=\&quot;80\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edges: Harbor → CompositionOperation --&gt;\n    &lt;mxCell id=\&quot;e-harbor-comp\&quot; value=\&quot;制品数据面 (直传, 不代理)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;harbor\&quot; target=\&quot;comp-op\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n        &lt;Array as=\&quot;points\&quot;&gt;\n          &lt;mxPoint x=\&quot;195\&quot; y=\&quot;760\&quot;/&gt;\n        &lt;/Array&gt;\n      &lt;/mxGeometry&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edge: Release Package → CompositionOperation --&gt;\n    &lt;mxCell id=\&quot;e-rel-comp\&quot; value=\&quot;Manifest Schema\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;release-pkg\&quot; target=\&quot;comp-op\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n        &lt;Array as=\&quot;points\&quot;&gt;\n          &lt;mxPoint x=\&quot;625\&quot; y=\&quot;760\&quot;/&gt;\n        &lt;/Array&gt;\n      &lt;/mxGeometry&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edge: Market → CompositionOperation --&gt;\n    &lt;mxCell id=\&quot;e-mkt-comp\&quot; value=\&quot;iv) 提交 Release + 授权上下文\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;fontSize=9;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;market\&quot; target=\&quot;comp-op\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Edge: CompOp → ExecPlan --&gt;\n    &lt;mxCell id=\&quot;e-comp-exec\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;comp-op\&quot; target=\&quot;exec-plan\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- LAYER 5: Provider Contracts --&gt;\n    &lt;mxCell id=\&quot;provider\&quot; value=\&quot;&amp;lt;b&amp;gt;Provider Contracts&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px&amp;quot;&amp;gt;Provider 合约层 (可替换)&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;• Kubernetes Runtime Driver (Gateway API)&amp;lt;br&amp;gt;• Container Engine Runtime Driver (T2)&amp;lt;br&amp;gt;• Edge Runtime Provider (KubeEdge, T3 POC)&amp;lt;br&amp;gt;• Service Provider (PostgreSQL, Valkey, RabbitMQ)&amp;lt;br&amp;gt;• 独立进程/容器运行, 不编译进 Core&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;1030\&quot; width=\&quot;320\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;mxCell id=\&quot;e-exec-prov\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;exec-plan\&quot; target=\&quot;provider\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- LAYER 6: Runtime Targets --&gt;\n    &lt;mxCell id=\&quot;targets\&quot; value=\&quot;&amp;lt;b&amp;gt;Runtime Targets&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;KubernetesTarget  &amp;amp;nbsp;|&amp;amp;nbsp;  ContainerEngineTarget (T2)  &amp;amp;nbsp;|&amp;amp;nbsp;  EdgeRuntimeTarget (T3)&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;250\&quot; y=\&quot;1180\&quot; width=\&quot;320\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;mxCell id=\&quot;e-prov-tgt\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;provider\&quot; target=\&quot;targets\&quot;&gt;\n      &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Legend --&gt;\n    &lt;mxCell id=\&quot;legend\&quot; value=\&quot;&amp;lt;b&amp;gt;图例&amp;lt;/b&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;🟢 Service Blueprint — 用户抽象层&amp;lt;br&amp;gt;🔵 App Market — 产品与发布目录&amp;lt;br&amp;gt;🟠 Harbor — OCI Registry 基础设施&amp;lt;br&amp;gt;🟡 pkg/appstore — 领域库/客户端层&amp;lt;br&amp;gt;🟣 Release Package — 发布完整性规格&amp;lt;br&amp;gt;⚪ 执行链路 — 运行治理平面&amp;lt;br&amp;gt;&amp;lt;hr&amp;gt;➡ 实线 = 直接引用/调用&amp;lt;br&amp;gt;↔ 虚线 = 双向约束/依赖&amp;lt;br&amp;gt;i-iv = 数据流顺序&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fafafa;strokeColor=#cccccc;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;650\&quot; y=\&quot;60\&quot; width=\&quot;220\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Violation Box --&gt;\n    &lt;mxCell id=\&quot;violation\&quot; value=\&quot;&amp;lt;b&amp;gt;⚠️ 当前违规&amp;lt;/b&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;ART-003 大文件直传&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;当前: app-market API 代理上传&amp;lt;br&amp;gt;  (ParseMultipartForm 100MB)&amp;lt;br&amp;gt;应为: 签发 Harbor 预签名 URL, &amp;lt;br&amp;gt;  客户端直接上传到 Harbor&amp;lt;br&amp;gt;  控制面仅记录元数据&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;650\&quot; y=\&quot;290\&quot; width=\&quot;220\&quot; height=\&quot;110\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Implementation Gap Box --&gt;\n    &lt;mxCell id=\&quot;gap\&quot; value=\&quot;&amp;lt;b&amp;gt;待实现缺口&amp;lt;/b&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;&amp;lt;b&amp;gt;ART-004 可替换后端&amp;lt;/b&amp;gt; — S3/Local 未实现&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;ART-005 三级分发&amp;lt;/b&amp;gt; — 未编排&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;ART-006 安全 GC&amp;lt;/b&amp;gt; — 平台侧引用保护未实现&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Release Package&amp;lt;/b&amp;gt; — REL-001~004 未实现&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Service Blueprint&amp;lt;/b&amp;gt; — BLUE-001~005 未实现&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fafafa;strokeColor=#cccccc;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;650\&quot; y=\&quot;430\&quot; width=\&quot;220\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n    &lt;!-- Data Flow Annotation --&gt;\n    &lt;mxCell id=\&quot;flow\&quot; value=\&quot;&amp;lt;b&amp;gt;数据流 (i → iv)&amp;lt;/b&amp;gt;&amp;lt;hr&amp;gt;&amp;lt;font style=&amp;quot;font-size: 9px&amp;quot;&amp;gt;i) Market 引用 Harbor Artifact (by digest)&amp;lt;br&amp;gt;ii) Market 引用 ReleaseManifest&amp;lt;br&amp;gt;iii) Package 声明 digest, 与 Harbor 互相约束&amp;lt;br&amp;gt;iv) Market 向 CompositionOperation 提交&amp;lt;br&amp;gt;     Release + 授权上下文 (不含 Secret)&amp;lt;br&amp;gt;v) Agent 直接从 Harbor 拉取制品 (直传)&amp;lt;br&amp;gt;vi) Operation 分步执行到 Provider/RuntimeTarget&amp;lt;/font&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#fafafa;strokeColor=#cccccc;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;\n      &lt;mxGeometry x=\&quot;650\&quot; y=\&quot;590\&quot; width=\&quot;220\&quot; height=\&quot;180\&quot; as=\&quot;geometry\&quot;/&gt;\n    &lt;/mxCell&gt;\n\n  &lt;/root&gt;\n&lt;/mxGraphModel&gt;&quot;}'></div>
