schema_version: 1
policy:
  levels: [unit, db_integration, real_e2e, production_ha]
  allowed_statuses: [not_run, partial, blocked, passed, failed]
  promotion: "A higher level is never inferred from a lower level. Passed requires a retained report and artifact identity."
  report_fields: [run_id, commit, command, environment, started_at, finished_at, exit_code, assertions, artifact_digests]
  legacy_results: "Prior chat/log summaries are historical traces only; do not promote without retained reports."
features:
  s0_three_host_lab_infrastructure:
    real_e2e:
      status: passed
      run_id: s2-s3-lab-20261018
      commit: 533d8ae41b386d9ae738528f73641720d40f997f
      report: reports/20261018-s2-s3-lab-infrastructure.md
      artifacts: reports/20261018-s2-s3-lab-infrastructure.json
      commands: ["python3 scripts/lab/verify-environment.py --output docs/acceptance/reports/20261018-s2-s3-lab-infrastructure.json"]
      scope: "three dedicated Ubuntu 24.04 hosts; independent 1-node management and 2-node target K3s, real TopoLVM and Traefik Gateway/TLS infrastructure only; HNB management was deployed later (see management_deployment); no S2 import/Agent E2E, S3 application, release qualification or HA"
      assertions: [independent_cluster_identities, three_nodes_ready, csi_ready_both_clusters, cross_node_dns_service_read, persistent_data_after_pod_recreation_and_worker_reboot, gateway_programmed, route_accepted_and_resolved, external_http_and_verified_tls, minimum_seven_gib_free]
      notes: "working tree source hashes in artifact; retained initial Job refusal, upstream Chart version rejection and verifier IP-SNI TLS failure; production budgets and HA unchanged"
    production_ha: {status: blocked}
  management_deployment:
    real_e2e:
      status: passed
      run_id: management-deployment-20261018
      commit: 533d8ae41b386d9ae738528f73641720d40f997f
      report: reports/20261018-management-deployment.md
      artifacts: reports/20261018-management-deployment.json
      commands: ["python3 scripts/lab/build-management.py --output-dir /tmp/opencode/hnb-lab-build", "/home/ubuntu/deploy-management.sh /home/ubuntu/management-infra.yaml infra", "/tmp/hnb-migrate -owner platform|market|artifact -dir /tmp/migrations -dsn-file /tmp/dsn-*", "/home/ubuntu/deploy-management.sh /home/ubuntu/management-full.yaml full", "curl http://127.0.0.1:18080/api/v1/auth/login"]
      scope: "management cluster startup deployment of 10 workloads from digest-pinned current checkout images, three-plane migrations, real admin login and authenticated reads; no lifecycle/kubernetes provider, target SecretReference, formal observer token issue/renew, independent-target import, Agent, S3 application, HA or production certification"
      assertions: [thirteen_images_digest_pinned, three_plane_migrations_applied, ten_workloads_ready, admin_login_real, authenticated_reads, anonymous_rejected, service_identity_revoke_route_registered, credentials_not_in_report]
      notes: "route registration bug fixed: Go 1.26 rejects wildcard+literal suffix {credentialId}:revoke; now /credentials/{credentialId}/revoke with regression test; management deployment is a prerequisite, not S2 completion"
