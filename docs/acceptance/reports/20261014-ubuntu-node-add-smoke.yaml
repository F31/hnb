apiVersion: v1
kind: Namespace
metadata:
  name: hnb-node-add-20261014
  labels:
    hnb.io/purpose: node-add-acceptance
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: hnb-node-add-20261014
  labels:
    app: hnb-node-add-server
spec:
  nodeName: hnb-ubuntu-cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: server
      image: quay.io/cilium/alpine-curl:v1.10.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            printf 'HTTP/1.1 200 OK\r\nContent-Length: 17\r\nConnection: close\r\n\r\nhnb-provider-e2e\n' | nc -l -p 8080 -w 5
          done
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: hnb-node-add-20261014
spec:
  selector:
    app: hnb-node-add-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: hnb-node-add-20261014
spec:
  nodeName: hnb-ubuntu-worker
  containers:
    - name: client
      image: quay.io/cilium/alpine-curl:v1.10.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            printf 'HTTP/1.1 200 OK\r\nContent-Length: 17\r\nConnection: close\r\n\r\nhnb-provider-e2e\n' | nc -l -p 8080 -w 5
          done
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 2
