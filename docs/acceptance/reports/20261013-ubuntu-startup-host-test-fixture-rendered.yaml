# Source: hnb/charts/nats/templates/statefulset.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    port: 4222
    http: 8222
    jetstream { store_dir: "/data/jetstream" }
    tls {
      cert_file: /var/run/nats-tls/tls.crt
      key_file: /var/run/nats-tls/tls.key
      ca_file: /var/run/nats-tls/ca.crt
      verify: true
    }
    accounts {
      platform {
        jetstream: enabled
        users: [{ user: "platform", password: $HNB_PLATFORM_PASSWORD }]
      }
      market {
        jetstream: enabled
        users: [{ user: "market", password: $HNB_MARKET_PASSWORD }]
      }
      artifact {
        jetstream: enabled
        users: [{ user: "artifact", password: $HNB_ARTIFACT_PASSWORD }]
      }
    }

---
# Source: hnb/charts/portal/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-nginx
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html/shell;
      location / { try_files $uri $uri/ /index.html; }
      location /config/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
      }
      location /modules/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
      }
      location /api/ {
        proxy_pass http://apiserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /tunnel {
        proxy_pass http://apiserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }

