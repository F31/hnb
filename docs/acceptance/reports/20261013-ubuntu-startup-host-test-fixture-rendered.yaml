          imagePullPolicy: IfNotPresent
          args: [--config, /etc/nats/nats.conf]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          env:
            - name: HNB_PLATFORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-platform-nats
                  key: password
            - name: HNB_MARKET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-market-nats
                  key: password
            - name: HNB_ARTIFACT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-artifact-nats
                  key: password
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 15
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data/jetstream
            - name: tls
              mountPath: /var/run/nats-tls
              readOnly: true
      volumes:
        - name: config
          configMap: {name: nats-config, defaultMode: 0444}
        - name: data
          persistentVolumeClaim:
            claimName: nats-data
        - name: tls
          secret:
            secretName: fixture-nats-tls
            defaultMode: 0400

