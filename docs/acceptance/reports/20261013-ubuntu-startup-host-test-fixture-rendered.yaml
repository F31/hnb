              value: "true"
            - name: NATS_URL
              value: tls://nats:4222
            - name: NATS_TLS_CERT_FILE
              value: /var/run/hnb-nats/tls.crt
            - name: NATS_TLS_KEY_FILE
              value: /var/run/hnb-nats/tls.key
            - name: NATS_TLS_CA_FILE
              value: /var/run/hnb-nats/ca.crt
            - name: DB_DSN
              value: postgres://fixture/fixture
            - name: CLUSTER_READ_PROJECTION_MODE
              value: "shadow"
            - name: API_TOKEN_ISSUER
              value: "https://issuer.hnb.test"
            - name: API_TOKEN_AUDIENCES
              value: "hnb-apiserver,hnb-platform-api,hnb-app-market"
            - name: API_TOKEN_PRIVATE_KEY_FILE
              value: /var/run/hnb-signing/active-private.pem
            - name: API_TOKEN_KEY_MANIFEST_FILE
              value: /var/run/hnb-identity/manifest.json
            - name: API_TOKEN_KEY_RELOAD_INTERVAL
              value: "5s"
            - name: AGENT_IMAGE
              value: "hnb/cluster-agent:latest"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          resources:
            limits:
              cpu: 400m
              memory: 512Mi
            requests:
              cpu: 125m
              memory: 256Mi
          volumeMounts:
            - name: identity-keys
              mountPath: /var/run/hnb-identity
              readOnly: true
            - name: active-signing-key
              mountPath: /var/run/hnb-signing
              readOnly: true
            - name: nats-client-tls
              mountPath: /var/run/hnb-nats
              readOnly: true
      volumes:
        - name: identity-keys
          secret:
            secretName: fixture-manifest
            defaultMode: 0400
        - name: active-signing-key
